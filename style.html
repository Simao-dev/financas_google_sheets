<style>

  :root {
    --primary: #7C3AED;
    --primary-hover: #6D28D9;
    --primary-light: rgba(124, 58, 237, 0.15);

    --success: #10B981;
    --success-bg: rgba(16, 185, 129, 0.12);
    --danger: #EF4444;
    --danger-bg: rgba(239, 68, 68, 0.12);
    --warning: #F59E0B;
    --warning-bg: rgba(245, 158, 11, 0.12);
    --info: #3B82F6;
    --info-bg: rgba(59, 130, 246, 0.12);

    --font-heading: 'Plus Jakarta Sans', sans-serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

    --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-full: 9999px;
  }

  body.dark-theme {
    --bg-main: #0B0F17;
    --bg-sidebar: #111827;
    --bg-card: #1F2937;
    --bg-card-hover: #374151;
    --bg-input: #111827;
    --border-color: #374151;
    --border-light: #1F2937;

    --text-title: #F9FAFB;
    --text-body: #E5E7EB;
    --text-muted: #9CA3AF;
    --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
    --modal-backdrop: rgba(0, 0, 0, 0.75);
  }

  body.light-theme {
    --bg-main: #F3F4F6;
    --bg-sidebar: #FFFFFF;
    --bg-card: #FFFFFF;
    --bg-card-hover: #F9FAFB;
    --bg-input: #F3F4F6;
    --border-color: #E5E7EB;
    --border-light: #F3F4F6;

    --text-title: #111827;
    --text-body: #374151;
    --text-muted: #6B7280;
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
    --modal-backdrop: rgba(17, 24, 39, 0.5);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: var(--font-body);
  }

  body {
    background-color: var(--bg-main);
    color: var(--text-body);
    min-height: 100vh;
    overflow-x: hidden;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  h1,
  h2,
  h3,
  h4,
  h5,
  h6 {
    font-family: var(--font-heading);
    color: var(--text-title);
    font-weight: 700;
  }

  a {
    color: var(--primary);
    text-decoration: none;
    transition: var(--transition);
  }

  button {
    cursor: pointer;
    border: none;
    outline: none;
    background: transparent;
    font-family: var(--font-heading);
    transition: var(--transition);
  }

  .value-masked.masked {
    filter: blur(7px) !important;
    user-select: none !important;
    pointer-events: none;
    transition: filter 0.2s ease;
  }

  .hidden {
    display: none !important;
  }

  .app-container {
    display: flex;
    min-height: 100vh;
  }

  
  .sidebar {
    width: 260px;
    background-color: var(--bg-sidebar);
    border-right: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    padding: 1.5rem 1rem;
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    z-index: 100;
    transition: var(--transition);
  }

  .sidebar.collapsed {
    width: 80px;
  }

  .sidebar-header {
    padding: 0 0.5rem 1.5rem 0.5rem;
  }

  .brand-logo {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .logo-icon {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, var(--primary), #9333EA);
    color: #FFFFFF;
    font-family: var(--font-heading);
    font-weight: 800;
    font-size: 1.25rem;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(124, 58, 237, 0.3);
  }

  .brand-name {
    font-size: 1.25rem;
    font-weight: 800;
    color: var(--text-title);
    font-family: var(--font-heading);
    white-space: nowrap;
  }

  .sidebar.collapsed .brand-name,
  .sidebar.collapsed .nav-text {
    display: none;
  }

  
  .sidebar-nav {
    margin-bottom: auto;
  
  }

  .nav-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }

  .nav-link {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    padding: 0.8rem 1rem;
    color: var(--text-muted);
    border-radius: var(--radius-md);
    font-size: 0.95rem;
    font-weight: 500;
    position: relative;
    white-space: nowrap;
    width: 100%;
  }

  .nav-link i {
    font-size: 1.1rem;
    width: 20px;
    text-align: center;
  }

  .nav-link:hover {
    color: var(--text-title);
    background-color: var(--primary-light);
  }

  .nav-link.active {
    color: #FFFFFF;
    background-color: var(--primary);
    font-weight: 600;
    box-shadow: 0 4px 12px rgba(124, 58, 237, 0.25);
  }

  
  .sidebar-footer {
    border-top: 1px solid var(--border-color);
    padding-top: 1rem;
  }

  .toggle-sidebar-btn {
    width: 100%;
    text-align: left;
  }

  .main-content {
    flex: 1;
    margin-left: 260px;
    display: flex;
    flex-direction: column;
    min-width: 0;
    transition: var(--transition);
  }

  .sidebar.collapsed~.main-content {
    margin-left: 80px;
  }

  .topbar {
    height: 70px;
    background-color: var(--bg-sidebar);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2rem;
    position: sticky;
    top: 0;
    z-index: 90;
  }

  .topbar-left {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .mobile-menu-btn {
    display: none;
    color: var(--text-title);
    font-size: 1.25rem;
  }

  .page-title-container h1 {
    font-size: 1.35rem;
    line-height: 1.2;
  }

  .page-subtitle {
    font-size: 0.825rem;
    color: var(--text-muted);
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 1.25rem;
  }

  .search-box {
    position: relative;
    width: 240px;
  }

  .search-box i {
    position: absolute;
    left: 0.85rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  .search-box input {
    width: 100%;
    padding: 0.55rem 0.85rem 0.55rem 2.25rem;
    background-color: var(--bg-input);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-full);
    color: var(--text-title);
    font-size: 0.875rem;
  }

  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: var(--radius-full);
    background-color: var(--bg-input);
    border: 1px solid var(--border-color);
    color: var(--text-title);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .badge-unread {
    position: absolute;
    top: -2px;
    right: -2px;
    background-color: var(--danger);
    color: #FFFFFF;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: var(--radius-full);
  }

  .user-avatar {
    width: 40px;
    height: 40px;
    border-radius: var(--radius-full);
    background: linear-gradient(135deg, var(--primary), #8B5CF6);
    color: #FFFFFF;
    font-weight: 700;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
  }

  .avatar-large {
    width: 64px;
    height: 64px;
    font-size: 1.5rem;
  }

  .content-body {
    padding: 2rem;
    flex: 1;
  }

  .view-section {
    display: none;
    animation: fadeIn 0.3s ease-in-out;
  }

  .view-section.active {
    display: block;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(6px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .dashboard-welcome {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.5rem;
  }

  .welcome-title {
    font-size: 1.6rem;
  }

  .welcome-subtitle {
    color: var(--text-muted);
    font-size: 0.9rem;
    margin-top: 0.25rem;
  }

  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 1.25rem;
    margin-bottom: 1.75rem;
  }

  .card,
  .kpi-card {
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 1.25rem;
    box-shadow: var(--shadow-sm);
    transition: var(--transition);
  }

  .kpi-card:hover {
    border-color: var(--primary);
    transform: translateY(-2px);
  }

  .kpi-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.75rem;
  }

  .kpi-title {
    font-size: 0.85rem;
    color: var(--text-muted);
    font-weight: 600;
  }

  .kpi-icon {
    width: 36px;
    height: 36px;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
  }

  .icon-purple {
    background: var(--primary-light);
    color: var(--primary);
  }

  .icon-green {
    background: var(--success-bg);
    color: var(--success);
  }

  .icon-red {
    background: var(--danger-bg);
    color: var(--danger);
  }

  .icon-blue {
    background: var(--info-bg);
    color: var(--info);
  }

  .kpi-value {
    font-size: 1.65rem;
    font-weight: 800;
    color: var(--text-title);
    font-family: var(--font-heading);
    margin-bottom: 0.5rem;
  }

  .kpi-trend {
    font-size: 0.78rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 0.25rem;
  }

  .trend-up {
    color: var(--success);
  }

  .trend-down {
    color: var(--danger);
  }

  .trend-neutral {
    color: var(--text-muted);
  }

  .quick-actions-container {
    margin-bottom: 1.75rem;
  }

  .section-subtitle {
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 0.75rem;
  }

  .quick-actions-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
  }

  .charts-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 1.25rem;
    margin-bottom: 1.75rem;
  }

  .chart-card {
    display: flex;
    flex-direction: column;
  }

  .chart-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
  }

  .chart-container {
    position: relative;
    height: 260px;
    width: 100%;
  }

  .btn-period {
    padding: 0.35rem 0.75rem;
    font-size: 0.8rem;
    border-radius: var(--radius-sm);
    color: var(--text-muted);
    background-color: var(--bg-input);
  }

  .btn-period.active {
    background-color: var(--primary);
    color: #FFFFFF;
    font-weight: 600;
  }

  .chart-legend {
    display: flex;
    gap: 1.25rem;
    justify-content: center;
    margin-top: 1rem;
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: var(--radius-full);
  }

  .dot-receitas {
    background-color: var(--success);
  }

  .dot-despesas {
    background-color: var(--danger);
  }

  .category-legend-list {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    margin-top: 1rem;
    max-height: 120px;
    overflow-y: auto;
  }

  .category-legend-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.825rem;
  }

  .dashboard-bottom-grid {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 1.25rem;
  }

  .card-header-flex {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.25rem;
  }

  .link-see-all {
    font-size: 0.85rem;
    font-weight: 600;
  }

  .table-responsive {
    width: 100%;
    overflow-x: auto;
  }

  .data-table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
  }

  .data-table th {
    padding: 0.85rem 1rem;
    font-size: 0.78rem;
    text-transform: uppercase;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border-color);
    font-weight: 600;
  }

  .data-table td {
    padding: 0.9rem 1rem;
    border-bottom: 1px solid var(--border-light);
    font-size: 0.9rem;
  }

  .data-table tbody tr:hover {
    background-color: var(--bg-card-hover);
  }

  .tx-item-flex {
    display: flex;
    align-items: center;
    gap: 0.85rem;
  }

  .tx-icon-box {
    width: 36px;
    height: 36px;
    border-radius: var(--radius-md);
    background-color: var(--bg-input);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-title);
    font-size: 0.9rem;
  }

  .tx-title-sub {
    display: flex;
    flex-direction: column;
  }

  .tx-title {
    font-weight: 600;
    color: var(--text-title);
  }

  .tx-sub {
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  .text-success {
    color: var(--success) !important;
    font-weight: 600;
  }

  .text-danger {
    color: var(--danger) !important;
    font-weight: 600;
  }

  .text-purple {
    color: var(--primary) !important;
  }

  .text-muted {
    color: var(--text-muted) !important;
  }

  .text-right {
    text-align: right;
  }

  .status-badge {
    padding: 0.25rem 0.65rem;
    border-radius: var(--radius-full);
    font-size: 0.75rem;
    font-weight: 600;
    display: inline-block;
  }

  .status-pago {
    background-color: var(--success-bg);
    color: var(--success);
  }

  .status-pendente {
    background-color: var(--warning-bg);
    color: var(--warning);
  }

  .section-top-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.5rem;
  }

  .patrimonio-banner {
    background: linear-gradient(135deg, #6366F1, #8B5CF6);
    border-radius: var(--radius-lg);
    padding: 2rem;
    color: #FFFFFF;
    margin-bottom: 2rem;
    box-shadow: 0 8px 20px rgba(99, 102, 241, 0.25);
  }

  .banner-title {
    font-size: 0.9rem;
    opacity: 0.9;
  }

  .banner-value {
    font-size: 2.25rem;
    font-weight: 800;
    font-family: var(--font-heading);
    margin: 0.5rem 0;
  }

  .banner-subtitle {
    font-size: 0.85rem;
    opacity: 0.8;
  }

  .section-block {
    margin-bottom: 2rem;
  }

  .section-block-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
  }

  .btn-add {
    color: var(--primary);
    font-weight: 600;
    font-size: 0.9rem;
  }

  .accounts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1rem;
  }

  .account-card {
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 1rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.25rem;
  }

  .credit-card-item {
    border-radius: var(--radius-lg);
    padding: 1.25rem;
    color: #FFFFFF;
    position: relative;
    box-shadow: var(--shadow-md);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 160px;
    cursor: pointer;
    transition: var(--transition);
  }

  .credit-card-item:hover {
    transform: translateY(-4px);
  }

  .card-purple {
    background: linear-gradient(135deg, #7C3AED, #A855F7);
  }

  .card-blue {
    background: linear-gradient(135deg, #1D4ED8, #3B82F6);
  }

  .card-dark {
    background: linear-gradient(135deg, #1F2937, #374151);
    border: 1px solid #4B5563;
  }

  .card-orange {
    background: linear-gradient(135deg, #EA580C, #F97316);
  }

  .card-green {
    background: linear-gradient(135deg, #059669, #10B981);
  }

  .credit-card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .credit-card-number {
    font-size: 1.1rem;
    letter-spacing: 0.1em;
    font-family: monospace;
    margin: 0.75rem 0;
  }

  .progress-bar-bg {
    width: 100%;
    height: 6px;
    background-color: rgba(255, 255, 255, 0.2);
    border-radius: var(--radius-full);
    overflow: hidden;
    margin: 0.5rem 0;
  }

  .progress-bar-fill {
    height: 100%;
    background-color: #FFFFFF;
    border-radius: var(--radius-full);
    transition: width 0.4s ease;
  }

  .invoice-details-card {
    margin-top: 1.5rem;
  }

  .invoice-metrics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1.25rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border-color);
  }

  .metric-item {
    display: flex;
    flex-direction: column;
  }

  .metric-label {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-bottom: 0.25rem;
  }

  .metric-value {
    font-size: 1.25rem;
    font-weight: 700;
    font-family: var(--font-heading);
  }

  .filter-panel {
    margin-bottom: 1.5rem;
  }

  .filter-search-row {
    position: relative;
    margin-bottom: 1.25rem;
  }

  .filter-search-row input {
    width: 100%;
    padding: 0.75rem 1rem 0.75rem 2.5rem;
    background-color: var(--bg-input);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    color: var(--text-title);
    font-size: 0.95rem;
  }

  .filter-icon {
    position: absolute;
    left: 1rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
  }

  .filter-pills-container {
    display: flex;
    flex-wrap: wrap;
    gap: 1.25rem;
    margin-bottom: 1.25rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border-color);
  }

  .filter-group {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    flex-wrap: wrap;
  }

  .filter-group-label {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-muted);
    margin-right: 0.3rem;
  }

  .pill-btn {
    padding: 0.35rem 0.85rem;
    border-radius: var(--radius-full);
    font-size: 0.8rem;
    background-color: var(--bg-input);
    color: var(--text-muted);
    border: 1px solid var(--border-color);
  }

  .pill-btn.active {
    background-color: var(--primary);
    color: #FFFFFF;
    border-color: var(--primary);
    font-weight: 600;
  }

  .category-chips-scroll {
    display: flex;
    gap: 0.5rem;
    overflow-x: auto;
    padding-bottom: 0.25rem;
  }

  .chip-btn {
    padding: 0.35rem 0.9rem;
    border-radius: var(--radius-sm);
    font-size: 0.8rem;
    background-color: var(--bg-input);
    color: var(--text-muted);
    white-space: nowrap;
  }

  .chip-btn.active {
    background-color: var(--primary-light);
    color: var(--primary);
    font-weight: 600;
  }

  .goals-grid,
  .budgets-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.25rem;
    margin-bottom: 1.5rem;
  }

  .goal-card,
  .budget-card {
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .goal-header,
  .budget-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.85rem;
  }

  .goal-badge {
